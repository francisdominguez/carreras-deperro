<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control y Análisis Profesional de Carreras</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>🏆 Control Profesional de Carreras</h1>
    <p>Motor de análisis con 12 algoritmos predictivos</p>
  </header>

  <!-- REGISTRO DE CARRERA -->
  <div class="card">
    <h2>📝 Registrar Nueva Carrera</h2>
    <form id="raceForm">
      <div class="input-group">
        <label for="raceId">Número de Carrera:</label>
        <input type="text" id="raceId" required placeholder="Ej: C-125">
      </div>
      <div class="input-group">
        <label for="winner">🥇 Primer Lugar (Ganador):</label>
        <select id="winner" required>
          <option value="">Selecciona perro (1-8)</option>
          <option value="1">Perro #1</option><option value="2">Perro #2</option>
          <option value="3">Perro #3</option><option value="4">Perro #4</option>
          <option value="5">Perro #5</option><option value="6">Perro #6</option>
          <option value="7">Perro #7</option><option value="8">Perro #8</option>
        </select>
      </div>
      <div class="input-group">
        <label for="secondPlace">🥈 Segundo Lugar (Palé):</label>
        <select id="secondPlace">
          <option value="">Ninguno</option>
          <option value="1">Perro #1</option><option value="2">Perro #2</option>
          <option value="3">Perro #3</option><option value="4">Perro #4</option>
          <option value="5">Perro #5</option><option value="6">Perro #6</option>
          <option value="7">Perro #7</option><option value="8">Perro #8</option>
        </select>
      </div>
      <div class="input-group">
        <label for="thirdPlace">🥉 Tercer Lugar (Trifecta - Opcional):</label>
        <select id="thirdPlace">
          <option value="">Ninguno</option>
          <option value="1">Perro #1</option><option value="2">Perro #2</option>
          <option value="3">Perro #3</option><option value="4">Perro #4</option>
          <option value="5">Perro #5</option><option value="6">Perro #6</option>
          <option value="7">Perro #7</option><option value="8">Perro #8</option>
        </select>
      </div>
      <div class="input-group">
        <label for="odd">💰 Cuota pagada (opcional, para EV):</label>
        <input type="number" id="odd" step="0.01" min="1" placeholder="Ej: 4.50">
      </div>
      <div class="input-group">
        <label for="bankroll">💵 Bankroll actual ($):</label>
        <input type="number" id="bankroll" step="0.01" min="0" placeholder="Ej: 100" value="100">
      </div>
      <button type="submit" class="btn-primary">💾 Guardar Carrera</button>
    </form>
  </div>

  <!-- PANEL DE ANÁLISIS -->
  <div class="card">
    <h2>🧠 Motor de Análisis Profesional</h2>
    <div id="statsContainer">
      <p>Procesando 12 algoritmos predictivos...</p>
    </div>
  </div>

  <!-- HISTORIAL -->
  <div class="card">
    <h2>📜 Historial Reciente</h2>
    <ul id="historyList">
      <li>Cargando historial...</li>
    </ul>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
