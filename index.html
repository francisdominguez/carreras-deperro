<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control y Análisis de Carreras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Control de Carreras</h1>
            <p>Registro y análisis inteligente (Ganador y Palé)</p>
        </header>

        <section class="card">
            <h2>Registrar Nueva Carrera</h2>
            <form id="raceForm">
                <div class="input-group">
                    <label for="raceId">Número de Carrera:</label>
                    <input type="text" id="raceId" required placeholder="Ej: 101">
                </div>
                
                <div class="input-group">
                    <label for="winner">Primer Lugar (Ganador):</label>
                    <select id="winner" required>
                        <option value="">Selecciona perro (1-8)</option>
                        <option value="1">Perro #1</option>
                        <option value="2">Perro #2</option>
                        <option value="3">Perro #3</option>
                        <option value="4">Perro #4</option>
                        <option value="5">Perro #5</option>
                        <option value="6">Perro #6</option>
                        <option value="7">Perro #7</option>
                        <option value="8">Perro #8</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="secondPlace">Segundo Lugar (Para Palé - Opcional):</label>
                    <select id="secondPlace">
                        <option value="">Ninguno</option>
                        <option value="1">Perro #1</option>
                        <option value="2">Perro #2</option>
                        <option value="3">Perro #3</option>
                        <option value="4">Perro #4</option>
                        <option value="5">Perro #5</option>
                        <option value="6">Perro #6</option>
                        <option value="7">Perro #7</option>
                        <option value="8">Perro #8</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Guardar Carrera</button>
            </form>
        </section>

        <section class="card">
            <h2>Panel de Estadísticas y Recomendaciones</h2>
            <div id="statsContainer">
                <p>Cargando datos y analizando patrones...</p>
            </div>
        </section>

        <section class="card">
            <h2>Historial Reciente</h2>
            <ul id="historyList">
                <li>Cargando historial...</li>
            </ul>
        </section>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
