<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Carreras - Optimizado</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>🏆 Control de Carreras</h1>
    <p>Análisis inteligente en una pantalla</p>
  </header>

  <!-- REGISTRO RÁPIDO -->
  <div class="card compact">
    <h2>📝 Registrar Carrera</h2>
    <form id="raceForm" class="compact-form">
      <div class="form-row">
        <div class="input-group">
          <label>Carrera:</label>
          <input type="text" id="raceId" required placeholder="0287">
        </div>
        <div class="input-group">
          <label>🥇 1ro:</label>
          <select id="winner" required>
            <option value="">-</option>
            <option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option>
            <option value="7">7</option><option value="8">8</option>
          </select>
        </div>
        <div class="input-group">
          <label>🥈 2do:</label>
          <select id="secondPlace">
            <option value="">-</option>
            <option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option>
            <option value="7">7</option><option value="8">8</option>
          </select>
        </div>
        <button type="submit" class="btn-save">💾</button>
      </div>
    </form>
  </div>

  <!-- TABS DE NAVEGACIÓN -->
  <div class="tabs-nav">
    <button class="tab-btn active" data-tab="analisis">📊 Análisis</button>
    <button class="tab-btn" data-tab="historial">📜 Historial</button>
    <button class="tab-btn" data-tab="estadisticas">📈 Stats</button>
    <button class="tab-btn" data-tab="pales">🔗 Palés</button>
  </div>

  <!-- CONTENIDO DE TABS -->
  <div class="tab-content">
    <!-- TAB: ANÁLISIS -->
    <div id="tab-analisis" class="tab-panel active">
      <div class="card">
        <div class="info-bar">
          <span id="totalCarreras">0</span> carreras | 
          Último: <strong id="ultimoGanador">#-</strong>
        </div>
        <h3>🎯 Top Recomendaciones:</h3>
        <div id="topRecomendaciones" class="grid-compact">
          <p>Cargando...</p>
        </div>
      </div>
    </div>

    <!-- TAB: HISTORIAL -->
    <div id="tab-historial" class="tab-panel">
      <div class="card">
        <h3>📜 Últimas Carreras:</h3>
        <ul id="historyList" class="history-compact">
          <li>Cargando...</li>
        </ul>
      </div>
    </div>

    <!-- TAB: ESTADÍSTICAS -->
    <div id="tab-estadisticas" class="tab-panel">
      <div class="card">
        <h3>📊 Desglose por Perro:</h3>
        <div id="desglosePerros" class="grid-stats">
          <p>Cargando...</p>
        </div>
      </div>
    </div>

    <!-- TAB: PALÉS -->
    <div id="tab-pales" class="tab-panel">
      <div class="card">
        <h3>🔗 Palés Más Frecuentes:</h3>
        <div id="palesFrecuentes" class="pales-list">
          <p>Cargando...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
